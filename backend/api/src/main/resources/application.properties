# ==========================================
# 1. Configuração do Servidor Spring Boot
# ==========================================
spring.application.name=medexpress-api
server.port=8080

# ==========================================
# 2. Conexão com o PostgreSQL (Docker)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/medexpress
spring.datasource.username=admin
spring.datasource.password=adminpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 3. Configurações do JPA e Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 4. Conexão com a Mensageria (ActiveMQ)
# ==========================================
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=adminpassword
