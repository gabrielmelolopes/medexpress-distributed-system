<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Estoque - Logística</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>📦 Controle de Estoque de Produtos</h1>

  <div class="form-container">
    <h2>Cadastrar Novo Produto</h2>
    <div id="mensagem-erro" class="alert-danger" style="display: none;"></div>
    <form id="produto-form">
      <input type="hidden" id="produto-id">

      <div class="form-group">
        <label for="nome">Nome do Produto:</label>
        <input type="text" id="nome" required placeholder="Ex: Teclado Mecânico">
      </div>

      <div class="form-group">
        <label for="preco">Preço (R$):</label>
        <input type="number" id="preco" step="0.01" required placeholder="0.00">
      </div>

      <div class="form-group">
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" required placeholder="0">
      </div>

      <button type="submit" id="btn-salvar">Salvar Produto</button>
    </form>
    <button id="btn-limpar">Limpar formulário</button>
  </div>

  <hr>

  <div class="tabela-container">
    <h2>Produtos em Estoque</h2>
    <table id="produtos-tabela">
      <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Quantidade</th>
        <th>Ações</th>
      </tr>
      </thead>
      <tbody id="tabela-corpo">
      </tbody>
    </table>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
