<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedExpress | Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="shared.css" rel="stylesheet">
</head>
<body>

<div id="overlay" class="overlay"></div>

<!--HEADER-->
<header class="top-bar">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid px-4 align-items-center gap-3">
            <a class="navbar-brand logo-text" href="index.html">MedExpress</a>
            <form class="d-flex search-bar flex-grow-1" onsubmit="return false;">
                <input class="form-control" type="search" id="campoBusca" placeholder="Buscar medicamentos, cosméticos e mais...">
                <button class="btn btn-busca" type="button"><i class="bi bi-search"></i></button>
            </form>
            <ul class="navbar-nav d-flex flex-row gap-3 align-items-center flex-shrink-0">
                <li class="nav-item" id="navLogin">
                    <a class="nav-link nav-action" href="login.html">
                        <i class="bi bi-person me-1"></i>
                        <span id="labelLogin">Login / Cadastro</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-action position-relative" href="#" id="btnAbrirCarrinho">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge bg-danger rounded-pill badge-carrinho">0</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-action" href="rastreamento.html">
                        <i class="bi bi-box-seam me-1"></i>Rastrear Pedido
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>

<!--BREADCRUMB-->
<div class="bg-white border-bottom py-2">
    <div class="container-fluid px-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0 small">
                <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none" style="color:var(--red)">Início</a></li>
                <li class="breadcrumb-item active" id="breadcrumbNome">Produto</li>
            </ol>
        </nav>
    </div>
</div>

<!--  CONTEÚDO -->
<main class="produto-page">
    <div class="container-fluid px-4">

        <!-- Estado de erro -->
        <div id="estadoErro" class="d-none">
            <div class="alert alert-danger mt-4">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span id="msgErro">Produto não encontrado.</span>
            </div>
            <a href="index.html" class="btn btn-outline-danger">← Voltar</a>
        </div>

        <!-- Conteúdo do produto -->
        <div id="conteudoProduto">

            <!-- Skeleton de loading -->
            <div id="skeleton" class="row g-4">
                <div class="col-md-5">
                    <div class="produto-galeria">
                        <div class="skeleton-block produto-skeleton" style="width:100%;height:320px;"></div>
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="produto-info-card">
                        <div class="skeleton-block produto-skeleton mb-3" style="height:28px;width:60%;"></div>
                        <div class="skeleton-block produto-skeleton mb-2" style="height:18px;width:40%;"></div>
                        <div class="skeleton-block produto-skeleton mb-4" style="height:48px;width:50%;"></div>
                        <div class="skeleton-block produto-skeleton mb-2" style="height:14px;width:100%;"></div>
                        <div class="skeleton-block produto-skeleton mb-2" style="height:14px;width:90%;"></div>
                        <div class="skeleton-block produto-skeleton mb-4" style="height:14px;width:75%;"></div>
                        <div class="skeleton-block produto-skeleton" style="height:48px;border-radius:24px;"></div>
                    </div>
                </div>
            </div>

            <!-- Dados reais (ocultos até carregar) -->
            <div id="dadosProduto" class="d-none row g-4">
                <div class="col-md-5">
                    <div class="produto-galeria">
                        <img id="produtoImagem" src="" alt="" onerror="this.src='https://placehold.co/400x320?text=Sem+Foto'">
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="produto-info-card">
                        <span class="produto-categoria" id="produtoCategoria"></span>
                        <h1 class="produto-titulo" id="produtoNome"></h1>

                        <div class="produto-avaliacao mb-2" id="produtoAvaliacao">
                            <span id="estrelasHtml"></span>
                            <span id="avaliacaoTexto"></span>
                        </div>

                        <div class="produto-preco-destaque">
                            <span class="atual" id="produtoPreco"></span>
                            <span class="original" id="produtoPrecoOriginal"></span>
                            <span class="desconto-badge d-none" id="produtoDesconto"></span>
                        </div>

                        <p class="produto-desc-completa" id="produtoDescricao"></p>

                        <div class="qtd-seletor">
                            <label>Quantidade:</label>
                            <button class="btn-qtd" id="btnMenos">−</button>
                            <span class="qtd-valor" id="qtdValor">1</span>
                            <button class="btn-qtd" id="btnMais">+</button>
                        </div>

                        <button class="btn-comprar" id="btnComprar">
                            <i class="bi bi-cart-plus"></i> Adicionar ao Carrinho
                        </button>

                        <div class="mt-3 d-flex gap-3 flex-wrap">
                            <div class="d-flex align-items-center gap-2 text-muted small">
                                <i class="bi bi-truck text-danger"></i> Entrega em todo Brasil
                            </div>
                            <div class="d-flex align-items-center gap-2 text-muted small">
                                <i class="bi bi-shield-check text-danger"></i> Produto original
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<!-- SIDEBAR CARRINHO -->
<div id="sidebarCarrinho" class="carrinho">
    <div class="carrinho-header">
        <h5 class="mb-0"><i class="bi bi-cart3 me-2"></i>Meu Carrinho</h5>
        <button id="btnFecharCarrinho" class="btn-fechar">&times;</button>
    </div>
    <div id="listaCarrinho" class="lista-carrinho"></div>
    <div class="carrinho-footer">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <strong>Total:</strong>
            <span class="total-valor">R$ <span id="totalCarrinho">0,00</span></span>
        </div>
        <button class="btn btn-finalizar w-100" id="btnFinalizarCompra">
            <i class="bi bi-bag-check me-2"></i>Finalizar Compra
        </button>
    </div>
</div>

<!--  TOAST -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1100">
    <div id="toastCarrinho" class="toast align-items-center text-bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body"><i class="bi bi-check-circle me-2"></i><span id="toastMsg"></span></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="shared.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        await initCarrinho();

        const id = parseInt(localStorage.getItem('medexpress_produto_id'));
        if (!id) {
            mostrarErro('ID do produto não informado.');
            return;
        }

        let produto;
        try {
            // GET /products/{id}
            const raw = await apiGetProduto(id);
            produto = backProdutoParaFront(raw);
        } catch (e) {
            mostrarErro('Não foi possível carregar o produto. Tente novamente.');
            return;
        }

        // Preenche os dados
        document.title = `MedExpress | ${produto.nome}`;
        document.getElementById('breadcrumbNome').textContent = produto.nome;
        document.getElementById('produtoImagem').src   = produto.imagem;
        document.getElementById('produtoImagem').alt   = produto.nome;
        document.getElementById('produtoNome').textContent    = produto.nome;
        document.getElementById('produtoDescricao').textContent = produto.descricao;
        document.getElementById('produtoPreco').textContent   = `R$ ${brl(produto.preco)}`;

        // Categoria - o back não retorna, então exibe genérico
        document.getElementById('produtoCategoria').textContent = 'Produto';

        // Avaliação - o back não retorna, omite
        document.getElementById('produtoAvaliacao').style.display = 'none';

        // Desconto - não temos precoOriginal no back, omite
        document.getElementById('produtoPrecoOriginal').style.display = 'none';

        // Mostra os dados, esconde skeleton
        document.getElementById('skeleton').classList.add('d-none');
        document.getElementById('dadosProduto').classList.remove('d-none');

        // Controle de quantidade
        let qtd = 1;
        const qtdValorEl = document.getElementById('qtdValor');

        document.getElementById('btnMenos').addEventListener('click', () => {
            if (qtd > 1) { qtd--; qtdValorEl.textContent = qtd; }
        });
        document.getElementById('btnMais').addEventListener('click', () => {
            qtd++;
            qtdValorEl.textContent = qtd;
        });

        // Adicionar ao carrinho
        document.getElementById('btnComprar').addEventListener('click', async () => {
            const btn = document.getElementById('btnComprar');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Adicionando...`;

            await adicionarAoCarrinho(produto, qtd);

            btn.disabled = false;
            btn.innerHTML = `<i class="bi bi-cart-plus"></i> Adicionar ao Carrinho`;
        });
    });

    function mostrarErro(msg) {
        document.getElementById('skeleton').classList.add('d-none');
        document.getElementById('dadosProduto').classList.add('d-none');
        document.getElementById('msgErro').textContent = msg;
        document.getElementById('estadoErro').classList.remove('d-none');
    }
</script>
</body>
</html>
