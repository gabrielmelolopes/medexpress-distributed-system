<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedExpress – Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="shared.css" rel="stylesheet">
</head>
<body class="pagina-login">

<!-- HEADER -->
<header class="site-header border-bottom bg-white">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center justify-content-between py-3">
            <a href="index.html" class="text-decoration-none">
                <span class="logo-text">MedExpress</span>
            </a>
            <div class="d-none d-md-flex align-items-center gap-4">
                <div class="d-flex align-items-center gap-2 header-info">
                    <i class="bi bi-headset fs-5"></i>
                    <span>Central de Atendimento</span>
                </div>
                <div class="d-flex align-items-center gap-2 header-info">
                    <i class="bi bi-shield-check fs-5"></i>
                    <span>Ambiente 100% seguro</span>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- CONTEÚDO -->
<main class="main-login">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="login-card">

                    <h1 class="login-title" id="titulo">Olá! Bem-vindo</h1>
                    <p class="login-subtitle" id="subtitulo">Acesse sua conta para continuar</p>

                    <!-- Alerta de erro da API -->
                    <div class="alert alert-danger py-2 d-none" id="alertaErro" role="alert">
                        <i class="bi bi-exclamation-circle me-1"></i>
                        <span id="mensagemErro"></span>
                    </div>

                    <form id="form" novalidate>

                        <!-- Campo nome: oculto no login, visível no cadastro -->
                        <div class="mb-3 campo-nome" id="campoNome" style="display:none;">
                            <label for="nome" class="form-label field-label">Nome completo</label>
                            <input
                                    type="text"
                                    class="form-control field-input"
                                    id="nome"
                                    placeholder="Digite seu nome"
                                    autocomplete="name"
                                    minlength="3"
                            >
                            <div class="invalid-feedback">Informe seu nome (mínimo 3 caracteres).</div>
                        </div>

                        <!-- E-mail -->
                        <div class="mb-3">
                            <label for="email" class="form-label field-label">E-mail</label>
                            <input
                                    type="email"
                                    class="form-control field-input"
                                    id="email"
                                    placeholder="seu@email.com"
                                    autocomplete="email"
                                    required
                            >
                            <div class="invalid-feedback">Informe seu e-mail.</div>
                        </div>

                        <!-- Senha -->
                        <div class="mb-3">
                            <label for="senha" class="form-label field-label">Senha</label>
                            <div class="input-password-wrapper">
                                <input
                                        type="password"
                                        class="form-control field-input"
                                        id="senha"
                                        placeholder="Mínimo 6 caracteres"
                                        autocomplete="current-password"
                                        minlength="6"
                                        required
                                >
                                <button type="button" class="btn-toggle-senha" id="toggleSenha" tabindex="-1">
                                    <i class="bi bi-eye" id="iconeSenha"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback">A senha precisa ter pelo menos 6 caracteres.</div>
                        </div>

                        <!-- Link esqueci a senha (só no login) -->
                        <div class="text-end mb-3" id="linkEsqueci">
                            <a href="#" class="link-vermelho small">Esqueci a senha</a>
                        </div>

                        <!-- Botão principal -->
                        <button type="submit" class="btn btn-entrar w-100" id="botaoPrincipal">
                            Entrar
                        </button>

                        <!-- Toggle cadastro/login -->
                        <p class="toggle-texto mt-4">
                            <span id="textoToggle">Não tem conta?</span>
                            <a href="#" class="link-vermelho fw-bold ms-1" id="toggleModo">Cadastre-se</a>
                        </p>

                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!--
    ORDEM DOS SCRIPTS É CRÍTICA:
    1. Bootstrap (necessário para Toast e outros componentes)
    2. shared.js  (declara API_BASE, getUsuario, setUsuario, brl, etc.)
    3. login.js   (usa API_BASE de shared.js; NÃO redeclara nenhuma const de shared.js)
-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="shared.js"></script>
<script src="login.js"></script>
</body>
</html>
